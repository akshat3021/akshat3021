<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B14"/>
      <stop offset="55%" stop-color="#0B1626"/>
      <stop offset="100%" stop-color="#081018"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#1B3A5C" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1B3A5C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#1A2A3F" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="320" fill="url(#bg)"/>
  <rect width="1000" height="320" fill="url(#grid)" opacity="0.5"/>
  <rect width="1000" height="320" fill="url(#spot)"/>

  <!-- faint giant watermark glyph -->
  <text x="640" y="260" font-family="SFMono-Regular,Consolas,monospace" font-size="230" fill="#0F2A44" opacity="0.5" font-weight="700">&lt;/&gt;</text>

  <!-- terminal window -->
  <g transform="translate(60,40)">
    <rect x="0" y="0" width="620" height="240" rx="10" fill="#0A1420" stroke="#1E3A5C" stroke-width="1.5"/>
    <!-- title bar -->
    <rect x="0" y="0" width="620" height="34" rx="10" fill="#0F1D30"/>
    <rect x="0" y="24" width="620" height="10" fill="#0F1D30"/>
    <circle cx="22" cy="17" r="6" fill="#FF5F56"/>
    <circle cx="44" cy="17" r="6" fill="#FFBD2E"/>
    <circle cx="66" cy="17" r="6" fill="#27C93F"/>
    <text x="310" y="21" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="12" fill="#6E8CAE">akshat@dev: ~/whoami</text>

    <!-- body -->
    <g font-family="SFMono-Regular,Consolas,monospace" font-size="16" fill="#C9E4FF">
      <text x="22" y="66"><tspan fill="#3FE0A5">➜</tspan> <tspan fill="#7FB8FF">~</tspan> whoami</text>
      <text x="22" y="94" fill="#F5F9FF" font-weight="600">Akshat Aswal</text>

      <text x="22" y="128"><tspan fill="#3FE0A5">➜</tspan> <tspan fill="#7FB8FF">~</tspan> cat role.txt</text>
      <text x="22" y="156" fill="#F5F9FF">Full-Stack Developer — I ship live products,</text>
      <text x="22" y="178" fill="#F5F9FF">not just repos.</text>

      <text x="22" y="212"><tspan fill="#3FE0A5">➜</tspan> <tspan fill="#7FB8FF">~</tspan> ./status --check</text>
      <text x="22" y="212" x2="0"/>
    </g>
    <g font-family="SFMono-Regular,Consolas,monospace" font-size="16">
      <text x="22" y="236" fill="#3FE0A5">✓ open to work</text>
      <rect x="215" y="224" width="10" height="16" fill="#00F0FF">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- side panel -->
  <g transform="translate(710,40)" font-family="SFMono-Regular,Consolas,monospace">
    <text x="0" y="30" font-size="30" font-weight="700" fill="#F5F9FF">Akshat Aswal</text>
    <rect x="0" y="44" width="230" height="4" rx="2" fill="url(#glow)"/>
    <text x="0" y="80" font-size="14" fill="#8FB6DE">B.Tech CSE · Graphic Era</text>
    <text x="0" y="100" font-size="14" fill="#8FB6DE">Hill University</text>

    <text x="0" y="140" font-size="13" fill="#5A7FA6">stack</text>
    <text x="0" y="162" font-size="14" fill="#C9E4FF">React · Next.js · Node.js</text>
    <text x="0" y="182" font-size="14" fill="#C9E4FF">PostgreSQL · Firebase</text>

    <g transform="translate(0,210)">
      <rect x="0" y="0" width="150" height="30" rx="15" fill="#0F2A44" stroke="#3FE0A5"/>
      <circle cx="18" cy="15" r="5" fill="#3FE0A5"/>
      <text x="32" y="20" font-size="13" fill="#3FE0A5">Open to work</text>
    </g>
  </g>
</svg>
