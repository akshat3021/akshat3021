<svg width="1000" height="430" viewBox="0 0 1000 430" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B14"/>
      <stop offset="100%" stop-color="#0B1626"/>
    </linearGradient>
    <pattern id="grid2" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#152538" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="430" fill="url(#bg2)"/>
  <rect width="1000" height="430" fill="url(#grid2)" opacity="0.4"/>

  <g transform="translate(40,30)">
    <rect x="0" y="0" width="920" height="370" rx="10" fill="#0A1420" stroke="#1E3A5C" stroke-width="1.5"/>
    <rect x="0" y="0" width="920" height="34" rx="10" fill="#0F1D30"/>
    <rect x="0" y="24" width="920" height="10" fill="#0F1D30"/>
    <circle cx="22" cy="17" r="6" fill="#FF5F56"/>
    <circle cx="44" cy="17" r="6" fill="#FFBD2E"/>
    <circle cx="66" cy="17" r="6" fill="#27C93F"/>
    <text x="460" y="21" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="12" fill="#6E8CAE">akshat@dev: ~/about</text>

    <g font-family="SFMono-Regular,Consolas,monospace" font-size="15">
      <text x="24" y="66"><tspan fill="#3FE0A5">➜</tspan> <tspan fill="#7FB8FF">~</tspan> <tspan fill="#F5F9FF">cat profile.json</tspan></text>

      <text x="24" y="98" fill="#7FB8FF">{</text>
      <text x="44" y="122"><tspan fill="#8FD6FF">"currently_building"</tspan><tspan fill="#F5F9FF">: </tspan><tspan fill="#F6C177">"CivicFix — civic complaint platform"</tspan><tspan fill="#F5F9FF">,</tspan></text>
      <text x="44" y="146"><tspan fill="#8FD6FF">"shipped"</tspan><tspan fill="#F5F9FF">: </tspan><tspan fill="#F6C177">"BookMySlot — live booking platform, Stripe + slot-locking"</tspan><tspan fill="#F5F9FF">,</tspan></text>
      <text x="44" y="170"><tspan fill="#8FD6FF">"learning"</tspan><tspan fill="#F5F9FF">: [</tspan><tspan fill="#F6C177">"serverless architecture"</tspan><tspan fill="#F5F9FF">, </tspan><tspan fill="#F6C177">"advanced TypeScript"</tspan><tspan fill="#F5F9FF">],</tspan></text>
      <text x="44" y="194"><tspan fill="#8FD6FF">"fun_fact"</tspan><tspan fill="#F5F9FF">: </tspan><tspan fill="#F6C177">"debugs with console.log"</tspan><tspan fill="#F5F9FF">,</tspan></text>
      <text x="44" y="218"><tspan fill="#8FD6FF">"ask_me_about"</tspan><tspan fill="#F5F9FF">: [</tspan><tspan fill="#F6C177">"React"</tspan><tspan fill="#F5F9FF">, </tspan><tspan fill="#F6C177">"Node.js"</tspan><tspan fill="#F5F9FF">, </tspan><tspan fill="#F6C177">"System Design"</tspan><tspan fill="#F5F9FF">]</tspan></text>
      <text x="24" y="242" fill="#7FB8FF">}</text>

      <text x="24" y="276"><tspan fill="#3FE0A5">➜</tspan> <tspan fill="#7FB8FF">~</tspan> <tspan fill="#F5F9FF">ls -1 highlights/</tspan></text>
      <text x="44" y="300" fill="#C9E4FF">🔭 Building CivicFix — role-based dashboards, live severity scoring</text>
      <text x="44" y="324" fill="#C9E4FF">🚀 Shipped BookMySlot — zero double-bookings under concurrency</text>
      <text x="44" y="348" fill="#C9E4FF">🌱 Deepening PostgreSQL, TypeScript, serverless patterns</text>

