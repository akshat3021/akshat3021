<svg width="1000" height="520" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B14"/>
      <stop offset="100%" stop-color="#0B1626"/>
    </linearGradient>
    <pattern id="grid3" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#152538" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="520" fill="url(#bg3)"/>
  <rect width="1000" height="520" fill="url(#grid3)" opacity="0.4"/>

  <text x="40" y="42" font-family="SFMono-Regular,Consolas,monospace" font-size="20" fill="#F5F9FF" font-weight="700">$ ls -la ./featured-projects</text>
  <rect x="40" y="54" width="240" height="3" fill="url(#accent)"/>

  <!-- CARD 1: CivicFix -->
  <g transform="translate(40,80)">
    <rect x="0" y="0" width="440" height="200" rx="10" fill="#0A1420" stroke="#1E3A5C" stroke-width="1.5"/>
    <rect x="0" y="0" width="440" height="30" rx="10" fill="#0F1D30"/>
    <rect x="0" y="20" width="440" height="10" fill="#0F1D30"/>
    <circle cx="18" cy="15" r="5" fill="#FF5F56"/>
    <circle cx="36" cy="15" r="5" fill="#FFBD2E"/>
    <circle cx="54" cy="15" r="5" fill="#27C93F"/>
    <rect x="76" y="7" width="330" height="16" rx="8" fill="#152538"/>
    <text x="88" y="19" font-family="SFMono-Regular,Consolas,monospace" font-size="11" fill="#6E8CAE">civicfix-r2if.onrender.com</text>
    <circle cx="418" cy="15" r="4" fill="#3FE0A5"/>

    <text x="20" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#F5F9FF">🌿 CivicFix</text>
    <text x="20" y="80" font-family="SFMono-Regular,Consolas,monospace" font-size="12" fill="#8FB6DE">Solarpunk-themed civic complaint platform</text>

    <text x="20" y="108" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#C9E4FF">Citizens report issues with photo + severity</text>
    <text x="20" y="126" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#C9E4FF">scoring; admins triage, dispatch, resolve —</text>
    <text x="20" y="144" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#C9E4FF">full role-based access + contributor leaderboard.</text>

    <g font-family="SFMono-Regular,Consolas,monospace" font-size="11" fill="#8FD6FF">
      <rect x="20" y="160" width="46" height="20" rx="10" fill="#152538"/>
      <text x="43" y="174" text-anchor="middle">Java</text>
      <rect x="72" y="160" width="90" height="20" rx="10" fill="#152538"/>
      <text x="117" y="174" text-anchor="middle">Servlets/JSP</text>
      <rect x="168" y="160" width="60" height="20" rx="10" fill="#152538"/>
      <text x="198" y="174" text-anchor="middle">SQLite</text>
      <rect x="234" y="160" width="66" height="20" rx="10" fill="#152538"/>
      <text x="267" y="174" text-anchor="middle">Docker</text>
    </g>
  </g>

  <!-- CARD 2: BookMySlot -->
  <g transform="translate(520,80)">
    <rect x="0" y="0" width="440" height="200" rx="10" fill="#0A1420" stroke="#1E3A5C" stroke-width="1.5"/>
    <rect x="0" y="0" width="440" height="30" rx="10" fill="#0F1D30"/>
    <rect x="0" y="20" width="440" height="10" fill="#0F1D30"/>
    <circle cx="18" cy="15" r="5" fill="#FF5F56"/>
    <circle cx="36" cy="15" r="5" fill="#FFBD2E"/>
    <circle cx="54" cy="15" r="5" fill="#27C93F"/>
    <rect x="76" y="7" width="330" height="16" rx="8" fill="#152538"/>
