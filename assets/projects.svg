    <circle cx="418" cy="15" r="4" fill="#3FE0A5"/>

    <text x="20" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#F5F9FF">🗓️ BookMySlot</text>
    <text x="20" y="80" font-family="SFMono-Regular,Consolas,monospace" font-size="12" fill="#8FB6DE">Full-stack booking &amp; scheduling platform</text>

    <text x="20" y="108" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#C9E4FF">Customer + Admin portals, real-time slot</text>
    <text x="20" y="126" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#C9E4FF">locking to kill double-booking, Stripe checkout</text>
    <text x="20" y="144" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#C9E4FF">+ webhooks, JWT auth, live Recharts analytics.</text>

    <g font-family="SFMono-Regular,Consolas,monospace" font-size="11" fill="#8FD6FF">
      <rect x="20" y="160" width="56" height="20" rx="10" fill="#152538"/>
      <text x="48" y="174" text-anchor="middle">React</text>
      <rect x="82" y="160" width="70" height="20" rx="10" fill="#152538"/>
      <text x="117" y="174" text-anchor="middle">Node.js</text>
      <rect x="158" y="160" width="94" height="20" rx="10" fill="#152538"/>
      <text x="205" y="174" text-anchor="middle">PostgreSQL</text>
      <rect x="258" y="160" width="66" height="20" rx="10" fill="#152538"/>
      <text x="291" y="174" text-anchor="middle">Stripe</text>
    </g>
  </g>

  <!-- Row 2: smaller entries -->
  <g transform="translate(40,304)">
    <rect x="0" y="0" width="920" height="90" rx="10" fill="#0A1420" stroke="#1E3A5C" stroke-width="1.5"/>
    <text x="24" y="34" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#F5F9FF">☁️ Cloud File Storage</text>
    <text x="24" y="56" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" fill="#8FB6DE">Secure upload / organize / retrieve system, built with React + Firebase.</text>
    <g font-family="SFMono-Regular,Consolas,monospace" font-size="11" fill="#8FD6FF">
      <rect x="24" y="66" width="56" height="18" rx="9" fill="#152538"/><text x="52" y="79" text-anchor="middle">React</text>
      <rect x="86" y="66" width="70" height="18" rx="9" fill="#152538"/><text x="121" y="79" text-anchor="middle">Firebase</text>
    </g>
    <circle cx="900" cy="20" r="4" fill="#5A7FA6"/>
