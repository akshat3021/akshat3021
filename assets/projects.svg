  <g transform="translate(40,406)">
    <rect x="0" y="0" width="920" height="90" rx="10" fill="#0A1420" stroke="#1E3A5C" stroke-width="1.5"/>
    <text x="24" y="34" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#F5F9FF">🛡️ Aegis Intelligence V2</text>
    <text x="24" y="56" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" fill="#8FB6DE">Next-gen intelligence platform — complete V2 rebuild in TypeScript for type safety &amp; scale.</text>
    <g font-family="SFMono-Regular,Consolas,monospace" font-size="11" fill="#8FD6FF">
      <rect x="24" y="66" width="90" height="18" rx="9" fill="#152538"/><text x="69" y="79" text-anchor="middle">TypeScript</text>
    </g>
    <circle cx="900" cy="20" r="4" fill="#5A7FA6"/>
  </g>
